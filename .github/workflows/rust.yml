name: "Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.88.0"
      - name: Check core library
        run: cargo check --locked -p dlpark --lib --no-default-features
      - name: Check all integrations
        run: cargo check --locked -p dlpark --lib --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Check generated bindings
        run: cargo xtask bindgen --check
      - name: Build
        run: cargo build --verbose --workspace --all-features
      - name: Run tests
        run: cargo test --verbose -p dlpark --features cpu-all
      - name: Run doctests
        run: cargo test --doc --verbose -p dlpark --features cpu-all
