name: "Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check generated bindings
        run: cargo xtask bindgen --check
      - name: Build
        run: cargo build --verbose --workspace --all-features
      - name: Run tests
        run: cargo test --verbose -p dlpark --features cpu-all
      - name: Run doctests
        run: cargo test --doc --verbose -p dlpark --features cpu-all
