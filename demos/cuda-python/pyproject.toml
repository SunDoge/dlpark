[project]
name = "dlpark-cuda-python"
version = "0.1.0"
description = "Local CuPy and Torch DLPack demo for dlpark's minimal CUDA FFI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.7.0",
]

[dependency-groups]
cuda12 = ["cupy-cuda12x"]
cuda13 = ["cupy-cuda13x"]
dev = ["maturin>=1.8"]

[tool.uv]
conflicts = [[{ group = "cuda12" }, { group = "cuda13" }]]

[tool.maturin]
module-name = "dlpark_cuda._core"
python-packages = ["dlpark_cuda"]
python-source = "python"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"
