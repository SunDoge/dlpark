[package]
name = "dlpark-cuda-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dlpark = { path = "../..", default-features = false, features = ["pyo3"] }
libloading = "0.8"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
snafu = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
