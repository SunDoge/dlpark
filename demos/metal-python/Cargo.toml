[package]
name = "dlpark-metal-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dlpark = { path = "../..", default-features = false, features = ["pyo3"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["MTLAllocation", "MTLBuffer", "MTLDevice", "MTLResource"] }
