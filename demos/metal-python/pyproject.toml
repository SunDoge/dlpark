[project]
name = "dlpark-metal-python"
version = "0.1.0"
description = "Local Apple-silicon Metal and MLX DLPack demo for dlpark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["maturin>=1.8"]

[tool.maturin]
module-name = "dlpark_metal._core"
python-packages = ["dlpark_metal"]
python-source = "python"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"
