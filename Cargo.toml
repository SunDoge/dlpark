[package]
name = "dlpark"
version = "0.9.0-beta.4"
edition = "2024"
rust-version = "1.87"
description = "Pure Rust DLPack implementation for zero-copy tensor interoperability"
documentation = "https://docs.rs/dlpark"
homepage = "https://crates.io/crates/dlpark"
repository = "https://github.com/SunDoge/dlpark"
license = "Apache-2.0"
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "docs/**",
  "LICENSE",
  "README.md",
  "benches/**",
  "src/**",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["candle", "half", "image", "ndarray", "safetensors"]

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.dependencies]
bitflags = "2.13"
candle-core = "0.11"
cudarc = "0.19.2"
half = "2.7"
image = { version = "0.25", default-features = false }
memmap2 = "0.9"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
pyo3 = "0.29"
safetensors = "0.8"
snafu = "0.9"

[[bench]]
name = "builder"
harness = false

[dependencies]
bitflags = { workspace = true }
snafu = { workspace = true }

candle-core = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
image = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8.2"

[features]
default = []

pyo3 = ["dep:pyo3"]

# support f16 and bf16
half = ["dep:half"]
image = ["dep:image"]
ndarray = ["dep:ndarray"]
safetensors = ["dep:memmap2", "dep:safetensors"]

candle = ["dep:candle-core"]
cudarc = ["cudarc/cuda-version-from-build-system", "cudarc/fallback-latest", "dep:cudarc"]

# CPU-testable interop features for regular tests.
cpu-all = ["candle", "half", "image", "ndarray", "pyo3", "safetensors"]

# Feature set suitable for Miri. This intentionally excludes `pyo3`, whose
# tests call the Python C API.
miri = ["candle", "half", "image", "ndarray", "safetensors"]

# Not supported yet — needs a CUDA toolchain to verify against candle's real (non-dummy) cuda backend
# candle-cuda = ["candle", "candle-core/cuda"]
