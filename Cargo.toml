[package]
name = "dlpark"
version = "0.9.0-beta.2"
edition = "2024"
rust-version = "1.87"
description = "Pure Rust DLPack implementation for zero-copy tensor interoperability"
documentation = "https://docs.rs/dlpark"
homepage = "https://crates.io/crates/dlpark"
repository = "https://github.com/SunDoge/dlpark"
license = "Apache-2.0"
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "src/**",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["candle", "cuda", "half", "image", "ndarray", "safetensors"]

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.dependencies]
bitflags = "2.13"
candle-core = "0.11"
cudarc = "0.19.2"
half = "2.7"
image = { version = "0.25", default-features = false }
memmap2 = "0.9"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
libloading = "0.8"
pyo3 = "0.29"
safetensors = "0.8"
snafu = "0.9"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
harness = false
name = "builder"

[[example]]
name = "ndarray-candle"
path = "examples/ndarray_candle.rs"
required-features = ["candle", "ndarray"]

[dependencies]
bitflags = { workspace = true }
snafu = { workspace = true }

candle-core = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
image = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8.2"
pprof = { version = "0.15.0", features = ["flamegraph"] }

[features]
default = []

pyo3 = ["dep:pyo3"]

# support f16 and bf16
half = ["dep:half"]
image = ["dep:image"]
ndarray = ["dep:ndarray"]
safetensors = ["dep:memmap2", "dep:safetensors"]

candle = ["dep:candle-core"]
cuda = ["dep:libc", "dep:libloading"]
metal = ["dep:objc2", "dep:objc2-metal"]
cudarc = ["cuda", "cudarc/cuda-version-from-build-system", "cudarc/fallback-latest", "dep:cudarc"]

# CPU-testable interop features for regular tests.
cpu-all = ["candle", "half", "image", "ndarray", "pyo3", "safetensors"]

# Feature set suitable for Miri. This intentionally excludes `pyo3`, whose
# tests call the Python C API.
miri = ["candle", "half", "image", "ndarray", "safetensors"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true, features = ["MTLDevice", "MTLBuffer", "MTLResource"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

# Not supported yet — needs a CUDA toolchain to verify against candle's real (non-dummy) cuda backend
# candle-cuda = ["candle", "candle-core/cuda"]

[profile.dev.package."*"]
opt-level = 2

# For profiling with pprof/flamegraph: release-level optimizations, but with
# debug info kept so the symbolizer can resolve inlined-frame boundaries
# (plain `--release` strips this, which is why inlined functions like
# fixed-rank builder calls collapse into their caller in a flamegraph).
[profile.profiling]
inherits = "release"
debug = true
