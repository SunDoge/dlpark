[tools]
actionlint = "1.7.12"
cocogitto = "7.0.0"
git-cliff = "2.13.1"
github-cli = "2.98.0"

[tasks.bindgen]
run = "cargo xtask bindgen"

[tasks."bindgen:check"]
run = "cargo xtask bindgen --check"

[tasks."vendor:dlpack"]
run = "cargo xtask vendor-dlpack"

[tasks.changelog]
description = "Regenerate CHANGELOG.md for the current dlpark version"
run = '''
package_id=$(cargo pkgid --package dlpark)
version=${package_id##*#}
version=${version##*@}
git cliff --tag "v${version}"
'''

[tasks.miri]
run = "cargo miri test"

[tasks.doc]
run = "cargo doc --open --no-default-features --features candle,half,image,ndarray"

[tasks."commit:check"]
run = "cog check origin/main..HEAD"
